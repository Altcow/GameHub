<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub 遊戲圖書館</title>
<meta name="theme-color" content="#2B1A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<div id="gate" class="gate">
  <form id="gateForm" class="gate-box" autocomplete="off">
    <div class="gate-seal">鎖</div>
    <h1>GameHub</h1>
    <p>請輸入通關密碼</p>
    <div class="gate-dots" id="gateDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <input id="gateInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="密碼" autofocus>
    <p id="gateMsg" class="gate-msg" role="alert"></p>
    <button type="submit">進入</button>
  </form>
</div>
<header class="top">
  <div class="hero"><div class="hero-in">
    <h1><span>GameHub</span> <span>遊戲圖書館</span></h1>
  </div></div>
  <p class="stats" id="stats">載入中…</p>
  <div class="tools">
    <div class="searchwrap"><input type="search" id="search" placeholder="搜尋名稱、簡介…" aria-label="搜尋"></div>
    <nav id="filters" class="filters" aria-label="分類"></nav>
  </div>
</header>
<main>
  <section id="recentBox" class="recent" hidden>
    <h2>最近更新</h2>
    <ul id="recent"></ul>
  </section>
  <section id="grid" class="grid"></section>
  <p id="empty" class="empty" hidden>書閣中查無此卷</p>
</main>
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button id="close" class="close" aria-label="關閉">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<script src="app.js"></script>
<script src="gate.js"></script>
</body>
</html>
